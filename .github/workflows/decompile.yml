name: Decompile
on: workflow_dispatch

jobs:
  decompile:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin

      - name: Download JADX
        uses: dawidd6/action-download-artifact@v27
        with:
          repo: skylot/jadx
          branch: master
          workflow: build-artifacts.yml
          name: (?<!win)$
          name_is_regexp: true

      - name: Decompile
        run: |
          curl -fsSLOJ https://maven.aliucord.com/releases/com/discord/discord/126021/discord-126021.apk
          sh */bin/jadx \
            --fs-case-sensitive \
            --respect-bytecode-access-modifiers \
            --show-bad-code \
            --no-inline-anonymous \
            --no-inline-methods \
            --no-inline-kotlin-lambda \
            --no-move-inner-classes \
            -j "$(nproc)" \
            -d . \
            discord-126021.apk || true

          find . -type f -name "*.java" -exec sed -i "/@Metadata(\|@kotlin.Metadata(\|import kotlin.Metadata/d" {} +

      - name: Update repository
        run: |
          git init
          git fetch https://github.com/RazerTexz/discord-126021-decompiled
          git reset FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resources sources
          git commit -m "chore: decompile"
          git push "https://x:${{ github.token }}@github.com/RazerTexz/discord-126021-decompiled" HEAD:main

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: decompile
          path: |
            resources
            sources
