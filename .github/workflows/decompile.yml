name: Decompile
on: [push, workflow_dispatch]
jobs:
  decompile:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Set up Java
        uses: actions/setup-java@v6.2.0
        with:
          java-version: 25
          distribution: temurin

      - name: Set up JADX
        uses: dawidd6/action-download-artifact@v28
        with:
          repo: skylot/jadx
          workflow: build-artifacts.yml
          name: ^jadx-(?!gui)
          name_is_regexp: true
          use_unzip: true

      - name: Decompile
        run: ./bin/jadx -d . -j "$(nproc)" --fs-case-sensitive --respect-bytecode-access-modifiers --show-bad-code --no-inline-anonymous --no-inline-methods --no-inline-kotlin-lambda --use-source-name-as-class-name-alias always "$(curl -fsSLOJ -w "%{filename_effective}" https://maven.aliucord.com/releases/com/discord/discord/126021/discord-126021.apk)" || true

      - name: Remove Kotlin metadata
        run: find . -type f -name "*.java" -exec sed -i "/@Metadata(\|@kotlin.Metadata(\|import kotlin.Metadata/d" {} +

      - name: Update repository
        run: |
          git init
          git fetch "https://github.com/${{ github.repository }}"
          git reset FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resources sources
          git commit -m "chore: decompile"
          git push "https://x:${{ github.token }}@github.com/${{ github.repository }}" HEAD:main

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: discord-120621-decompiled
          path: |
            resources
            sources
