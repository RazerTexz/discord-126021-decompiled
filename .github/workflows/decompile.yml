name: Decompile
on: [push, workflow_dispatch]
jobs:
  decompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Decompile
        run: |
          unzip "$(curl -LOJ -w "%{filename_effective}" https://nightly.link/skylot/jadx/workflows/build-artifacts/master/jadx-r2751.55982e0.zip.zip)"
          sh */bin/jadx \
            -j "$(nproc)" \
            -d . \
            --fs-case-sensitive \
            --respect-bytecode-access-modifiers \
            --show-bad-code \
            --no-inline-anonymous \
            --no-inline-methods \
            --no-inline-kotlin-lambda \
            --use-source-name-as-class-name-alias always \
            "$(curl -LOJ -w "%{filename_effective}" https://maven.aliucord.com/releases/com/discord/discord/126021/discord-126021.apk)" || true

          find . -type f -name "*.java" -exec sed -i "/@Metadata(\|@kotlin.Metadata(\|import kotlin.Metadata/d" {} +

      - name: Update repository
        run: |
          git init
          git fetch "https://github.com/${{ github.repository }}"
          git reset FETCH_HEAD

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add resources sources
          git commit -m "chore: decompile"
          git push "https://x:${{ github.token }}@github.com/${{ github.repository }}" HEAD:main

      - name: Upload
        uses: actions/upload-artifact@main
        with:
          name: ${{ github.job }}
          path: |
            resources
            sources
          compression-level: 0
